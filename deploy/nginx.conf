server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # App JSON logs omit raw paths, query strings and credentials.
    access_log off;

    # Upstream failures can include the raw OAuth callback query in error logs.
    error_log stderr crit;
    client_max_body_size 640k;

    location ~ ^/api(?:/|$)|^/(?:health|ready)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors off;
    }

    location ~ ^/(?:internal|_protected|uploads)(?:/|$) {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
