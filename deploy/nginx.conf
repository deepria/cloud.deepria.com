server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # App JSON logs omit raw paths, query strings and credentials.
    access_log off;

    # Upstream failures can include the raw OAuth callback query in error logs.
    error_log stderr crit;
    client_max_body_size 640k;

    location ~ ^/api(?:/|$)|^/(?:health|ready)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors off;
    }

    location = /uploads {
        return 404;
    }

    location ^~ /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:3000;
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 310s;
    }

    location ~ "^/_protected/files/(?<download_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$" {
        internal;
        alias /srv/tusd-data/$download_id;
        disable_symlinks on from=/srv/tusd-data;
        types {}
        default_type application/octet-stream;
        etag off;
        if_modified_since off;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(?:internal|_protected)(?:/|$) {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
