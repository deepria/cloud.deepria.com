name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the isolated stack
        run: |
          printf 'LOCAL_DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          docker compose build
          docker compose up -d --wait
      - name: Verify readiness and database outage
        run: |
          curl -fsS --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/ready
          scripts/smoke.sh
          docker compose stop db
          scripts/smoke.sh http://127.0.0.1:8080 503
          docker compose start db
          curl -fsS --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/ready
          scripts/smoke.sh
      - name: Collect logs
        if: failure()
        run: docker compose logs --tail 80
      - name: Clean up test stack
        if: always()
        run: docker compose down --volumes
