# Local development only. PostgreSQL and the API have no public host ports.
services:
  db:
    image: postgres:18.7-bookworm@sha256:e742a2668255221388004f3a42b6150a2103f5054ab3a4a93ae9e4f01e551c35
    environment:
      POSTGRES_USER: cloud_dev
      POSTGRES_DB: cloud_dev
      POSTGRES_PASSWORD: "${LOCAL_DB_PASSWORD:?set a local hex password in .env}"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cloud_dev", "-d", "cloud_dev"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: cloud-deepria-api:local
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["migrate"]
    environment:
      MIGRATION_DATABASE_URL: "postgresql://cloud_dev:${LOCAL_DB_PASSWORD:?set a local hex password in .env}@db:5432/cloud_dev"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: cloud-deepria-api:local
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      DATABASE_URL: "postgresql://cloud_dev:${LOCAL_DB_PASSWORD:?set a local hex password in .env}@db:5432/cloud_dev"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:
