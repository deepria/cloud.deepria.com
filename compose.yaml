# Local development only. PostgreSQL and the API have no public host ports.
services:
  db:
    image: postgres:18.7-bookworm@sha256:e742a2668255221388004f3a42b6150a2103f5054ab3a4a93ae9e4f01e551c35
    environment:
      POSTGRES_USER: cloud_dev
      POSTGRES_DB: cloud_dev
      POSTGRES_PASSWORD: "${LOCAL_DB_PASSWORD:?set a local hex password in .env}"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cloud_dev", "-d", "cloud_dev"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: cloud-deepria-api:local
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["migrate"]
    environment:
      MIGRATION_DATABASE_URL: "postgresql://cloud_dev:${LOCAL_DB_PASSWORD:?set a local hex password in .env}@db:5432/cloud_dev"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: cloud-deepria-api:local
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      DATABASE_URL: "postgresql://cloud_dev:${LOCAL_DB_PASSWORD:?set a local hex password in .env}@db:5432/cloud_dev"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://127.0.0.1:${WEB_PORT:-8080}}"
      GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID:-}"
      GITHUB_OAUTH_CLIENT_SECRET: "${GITHUB_OAUTH_CLIENT_SECRET:-}"
      TUS_UPSTREAM_URL: http://tusd:8080/files/
      TUS_INTERNAL_TOKEN: "${TUS_INTERNAL_TOKEN:?set a random hex token in .env}"
    networks:
      - default
      - transfer
    depends_on:
      migrate:
        condition: service_completed_successfully

  verify-uploads:
    image: cloud-deepria-api:local
    command: ["verify-uploads"]
    environment:
      DATABASE_URL: "postgresql://cloud_dev:${LOCAL_DB_PASSWORD:?set a local hex password in .env}@db:5432/cloud_dev"
      TUS_UPLOAD_DIR: /srv/tusd-data
    volumes:
      - uploads-data:/srv/tusd-data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      tusd:
        condition: service_started

  tusd:
    image: tusproject/tusd:v2.10.1@sha256:7b1c552a8b42f4b36cb01f2a3bd49f82ab078b2eefd191459e716141dd50376c
    entrypoint: ["/usr/local/bin/tusd"]
    command:
      - -upload-dir=/srv/tusd-data
      - -base-path=/files/
      - -disable-download
      - -disable-cors
      - -max-size=10737418240
      - -hooks-http=http://api:3000/internal/tusd
      - -hooks-enabled-events=pre-create,post-finish
      - -hooks-http-forward-headers=X-Deepria-Tus-Token
      - -hooks-http-retry=0
    volumes:
      - uploads-data:/srv/tusd-data
    networks:
      - transfer

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started

networks:
  transfer:
    internal: true

volumes:
  db-data:
  uploads-data:
